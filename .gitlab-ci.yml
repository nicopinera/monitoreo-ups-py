stages: [calidad,test,seguridad]

variables:
  UV_VERSION: "0.13.0"
  UV_CHACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: copy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

.uv:
  image: python:3.10-slim-bookworm
  cache:
    key: { files: [uv.lock] }
    paths: [.uv-cache]
  before_script:
    - pip install --quiet "uv==${UV_VERSION}"
    - uv sync --locked            # falla si uv.lock no coincide con pyproject.toml
  after_script:
    - uv cache prune --ci

ruff:
  extends: .uv
  stage: calidad
  script:
    - uv run ruff check .
    - uv run ruff format --check .

mypy:
  extends: .uv
  stage: calidad
  allow_failure: true             # no bloquea hasta que agreguemos type hints (B5)
  script:
    - uv run mypy

pytest:
  extends: .uv
  stage: test
  script:
    - uv run pytest --cov --cov-report=term --cov-report=xml --junitxml=report.xml
  coverage: '/TOTAL.*? (\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report: { coverage_format: cobertura, path: coverage.xml }

pip-audit:
  image: python:3.10-slim-bookworm
  stage: seguridad
  before_script:
    - pip install --quiet "uv==${UV_VERSION}"
  script:
    - uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt
    - uvx pip-audit --strict --disable-pip --require-hashes -r requirements.txt