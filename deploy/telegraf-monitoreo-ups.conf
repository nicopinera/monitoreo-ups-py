# Input de Telegraf del monitoreo de UPS. Se instala como /etc/telegraf/telegraf.d/monitoreo-ups.conf
# (ver docs/runbook_vm.md). No se actualiza con el deploy: si cambia, volver a copiarlo.
#
# - run --rm: un contenedor nuevo por ejecucion, que se borra al terminar.
# - -T: sin TTY (agrega \r al final de cada linea y rompe el line protocol).
# - -f con ruta absoluta: Telegraf no usa un shell, asi que "cd ... &&" no funcionaria.

[[inputs.exec]]
  commands = [
    "docker compose -f /etc/telegraf/monitoreo-ups/compose.yaml run --rm -T monitoreo",
  ]
  interval = "60s"
  # Peor caso medido: ~6 s, mas ~1 s de arranque del contenedor
  timeout = "30s"
  data_format = "influx"
